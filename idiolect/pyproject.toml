[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "idiolect"
version = "0.1.0"
description = "A portable profile of how one person writes, so any AI model understands their slang, typos and intent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
learn = ["wordfreq>=3.0"]

[project.scripts]
idiolect = "idiolect.__main__:main"

[tool.setuptools]
packages = ["idiolect"]
